openapi: 3.1.0
info:
  title: CuteCart Search API (M2 — T4.5)
  version: 1.0.0
  description: >
    PostgreSQL full-text search endpoint for CuteCart stationery products.
    Returns only published products belonging to active stores.
    Query parameters are aligned with M4's Catalogue API (/api/v1/products).
servers:
  - url: /api/v1
paths:
  /products/search:
    get:
      operationId: searchProducts
      summary: Full-text search, filter, and sort published products
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: false
          description: Full-text query matching product name (weight A), category (weight B), and description (weight C).
          schema:
            type: string
            maxLength: 200
            example: sakura notebook
        - name: category
          in: query
          required: false
          description: Filter by category slug (e.g., `notebooks`) or category UUID.
          schema:
            type: string
            example: notebooks
        - name: store
          in: query
          required: false
          description: Filter by active store slug (e.g., `paperpetal`) or store UUID.
          schema:
            type: string
            example: paperpetal
        - name: minPrice
          in: query
          required: false
          description: Minimum variant price in PKR.
          schema:
            type: number
            minimum: 0
            example: 500
        - name: maxPrice
          in: query
          required: false
          description: Maximum variant price in PKR.
          schema:
            type: number
            minimum: 0
            example: 2500
        - name: inStock
          in: query
          required: false
          description: When `true`, only include products with available stock > 0.
          schema:
            type: string
            enum: ['true', 'false']
        - name: sort
          in: query
          required: false
          description: Sort order. Defaults to `relevance` when `q` is provided, otherwise `newest`.
          schema:
            type: string
            enum:
              - relevance
              - price_asc
              - price_desc
              - name_asc
              - name_desc
              - newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of matching published products in PKR
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSearchHit'
                  meta:
                    $ref: '#/components/schemas/SearchMeta'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ProductSearchHit:
      type: object
      required:
        - id
        - name
        - slug
        - price
        - currency
        - inStock
        - category
        - store
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '1450.00'
        maxPrice:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '1550.00'
        currency:
          type: string
          enum: [PKR]
        inStock:
          type: boolean
        availableStock:
          type: integer
          minimum: 0
        variantCount:
          type: integer
          minimum: 1
        isFeatured:
          type: boolean
        isBestseller:
          type: boolean
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        store:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
            city:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time

    SearchMeta:
      type: object
      required: [page, pageSize, total, totalPages, sort, currency, filters]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        sort:
          type: string
        currency:
          type: string
          enum: [PKR]
        filters:
          type: object

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: pageSize must be an integer between 1 and 100
